<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grazie - Progetto €1</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
      color: #111;
      text-align: center;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 80px 25px;
    }

    .card {
      background: white;
      padding: 45px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .emoji {
      font-size: 65px;
    }

    h1 {
      font-size: 38px;
      margin: 20px 0;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
      color: #444;
    }

    .prize {
      margin-top: 30px;
      padding: 25px;
      border-radius: 18px;
      background: #f0f0f0;
      font-size: 22px;
      font-weight: bold;
    }

    .small {
      margin-top: 35px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="emoji">🎉</div>

      <h1>CE L'HAI FATTA.</h1>

      <p>
        Hai appena speso 1 €.
      </p>

      <p>
        Non puoi più tornare indietro.
      </p>

      <div class="prize">
        🏆 Complimenti.<br><br>
        Hai ufficialmente finanziato qualcosa
        che non serve assolutamente a niente.
      </div>

      <p class="small">
        Grazie per aver partecipato al Progetto €1.
      </p>

    </div>

  </div>

</body>
</html>
