<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Project €1</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, Helvetica, sans-serif;

  background:
    radial-gradient(
      circle at top,
      #303030 0%,
      #111 48%,
      #050505 100%
    );

  color: white;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 24px;
}

.container {
  width: 100%;
  max-width: 620px;
  text-align: center;
}

.logo {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 5px;
  color: #aaa;
  margin-bottom: 28px;
}

.card {
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(15px);
  border-radius: 30px;
  padding: 42px 25px;
  box-shadow: 0 25px 80px rgba(0,0,0,.5);
}

h1 {
  font-size: clamp(35px, 8vw, 55px);
  margin: 0;
  letter-spacing: -2px;
}

.intro {
  color: #aaa;
  font-size: 18px;
  line-height: 1.6;
  margin: 18px auto 30px;
  max-width: 470px;
}

.price {
  font-size: 64px;
  font-weight: 900;
  margin: 25px 0;
  letter-spacing: -3px;
}

.button {
  display: inline-block;
  background: white;
  color: #111;
  text-decoration: none;
  padding: 17px 38px;
  border-radius: 50px;
  font-size: 19px;
  font-weight: bold;
  transition: .2s;
}

.button:hover {
  transform: scale(1.04);
}

.how {
  margin-top: 35px;
  padding: 24px 20px;
  border-radius: 22px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1);
}

.howTitle {
  font-size: 13px;
  letter-spacing: 2px;
  font-weight: bold;
  color: #aaa;
  margin-bottom: 15px;
}

.how p {
  color: #ddd;
  font-size: 17px;
  line-height: 1.5;
  margin: 8px 0;
}

.warning {
  margin-top: 25px;
  color: #666;
  font-size: 12px;
  line-height: 1.5;
}

.footer {
  margin-top: 22px;
  color: #555;
  font-size: 11px;
}

</style>

</head>

<body>

<div class="container">

  <div class="logo">
    PROJECT €1
  </div>

  <div class="card">

    <h1>
      HAI UN EURO<br>
      DA SPRECARE?
    </h1>

    <p class="intro">
      Spendi €1 e scopri
      cosa ti è capitato.
    </p>

    <div class="price">
      €1
    </div>

    <a
      class="button"
      href="https://buy.stripe.com/fZu14ndyg5AY7Pdde3f7i00"
    >
      SPRECA €1
    </a>

    <div class="how">

      <div class="howTitle">
        COME FUNZIONA
      </div>

      <p>① Paghi €1.</p>

      <p>② Ricevi una sorpresa digitale.</p>

      <p>③ Ti chiedi perché l'hai fatto.</p>

    </div>

    <div class="warning">
      Non promettiamo niente di utile.<br>
      Solo una sorpresa.
    </div>

  </div>

  <div class="footer">
    PROJECT €1<br>
    Un progetto completamente inutile.
  </div>

</div>

</body>
</html>
